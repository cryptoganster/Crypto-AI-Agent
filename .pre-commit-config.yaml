# Pre-commit configuration for scraping-service
# See https://pre-commit.com for more information

repos:
  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.5.0
          - sqlalchemy>=2.0.23
        files: ^src/

  # Code formatting with black
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--check, --diff]
        files: ^src/

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--check-only, --diff]
        files: ^src/

  # Style guide enforcement with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203]
        files: ^src/

  # Custom local hooks for running tests
  - repo: local
    hooks:
      - id: unit-tests
        name: Run unit tests
        entry: bash scripts/run-unit-tests.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: integration-tests
        name: Run integration tests
        entry: bash scripts/run-integration-tests.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

# Configure when hooks run
default_stages: [pre-commit]

# Disable unnecessary hooks
exclude: '^docs/|^node_modules/|\.eggs$|\.git$|\.hg$|\.mypy_cache$|\.nox$|\.tox$|\.venv$|build|dist'

# Configure when hooks run
default_stages: [pre-commit]

# Disable unnecessary hooks
exclude: '^docs/|^node_modules/|\.eggs$|\.git$|\.hg$|\.mypy_cache$|\.nox$|\.tox$|\.venv$|build|dist'

# Require all files to pass before committing
fail_fast: false
